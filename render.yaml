databases:
  - name: codelearn-db
    databaseName: codelearn
    user: codelearn_user
    plan: free

services:
  - type: web
    name: codelearn
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: codelearn-db
          property: connectionString
