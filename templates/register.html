{% extends "base.html" %}
{% block title %}Регистрация — CodeLearn{% endblock %}
{% block content %}
<div class="container-narrow">
    <div class="form-card">
        <h2>Создать аккаунт</h2>
        <p class="form-subtitle">Начните изучать программирование</p>

        <form method="POST">
            <div class="form-group">
                <label for="username">Имя пользователя</label>
                <input type="text" id="username" name="username" class="form-control"
                       placeholder="Минимум 3 символа" required minlength="3">
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" class="form-control"
                       placeholder="example@mail.com" required>
            </div>
            <div class="form-group">
                <label for="password">Пароль</label>
                <input type="password" id="password" name="password" class="form-control"
                       placeholder="Минимум 6 символов" required minlength="6">
            </div>
            <div class="form-group">
                <label for="confirm_password">Подтвердите пароль</label>
                <input type="password" id="confirm_password" name="confirm_password"
                       class="form-control" placeholder="Повторите пароль" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Зарегистрироваться</button>
        </form>

        <p class="form-footer">
            Уже есть аккаунт? <a href="{{ url_for('login') }}">Войти</a>
        </p>
    </div>
</div>
{% endblock %}
