{% extends "base.html" %}
{% block title %}Курсы{% endblock %}
{% block content %}
<div class="container">
    <h1 class="section-title">Все курсы</h1>
    <div class="course-grid">
        {% for cid, course in courses.items() %}
        <div class="course-card" style="--course-color: {{ course.color }}">
            <div class="course-icon">{{ course.icon }}</div>
            <h3>{{ course.title }}</h3>
            <p>{{ course.description }}</p>
            <div class="course-meta">
                <span>{{ course.lessons|length }} уроков</span>
                <a href="{{ url_for('learn', course_id=cid, lesson_index=0) }}" class="btn btn-primary btn-sm">Начать</a>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
